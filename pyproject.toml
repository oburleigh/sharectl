[project]
name = "sharectl"
version = "0.1.0"
description = "Self-healing controller that keeps services running across PoPs, cloud regions and partner machines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oli Burleigh" }]
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.1,<3.0.0",
]

[project.urls]
Repository = "https://github.com/oburleigh/sharectl"

[project.scripts]
sharectl = "sharectl.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9,<7.0.0",
    "import-linter>=2.15,<3.0",
    "mutmut>=3.8.0,<4.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pre-commit>=4.7.0,<5.0.0",
    "pylint>=4.1.3,<5.0.0",
    "pyright>=1.1.414,<2.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
    "twine>=7.0.0,<8.0.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ARG", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "ERA", "F", "FBT", "FURB", "I", "N",
    "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20", "TC",
    "TID", "TRY", "UP", "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 10
max-returns = 4
max-statements = 30
max-bool-expr = 4

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportShadowedImports = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pylint.main]
py-version = "3.15"
fail-under = 10

[tool.pylint."messages control"]
disable = ["missing-class-docstring", "missing-function-docstring", "missing-module-docstring"]

[tool.pylint.design]
max-args = 5
max-positional-arguments = 3
max-branches = 10
max-returns = 4
max-statements = 30
max-bool-expr = 4
max-locals = 12
# A Protocol or fake for an outside system with one call has one public method.
min-public-methods = 1

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = ["script: runs a scenario script as a subprocess through uv"]

[tool.coverage.run]
branch = true
source = ["sharectl"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/sharectl/"]
also_copy = ["inventory/", "scenarios/"]
# The scripts run `uv run` on the repository, which mutmut's copy is not.
pytest_add_cli_args = ["-m", "not script"]
pytest_add_cli_args_test_selection = ["tests/"]
