coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0.5%
    patch:
      default:
        target: 90%
        threshold: 0%

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
