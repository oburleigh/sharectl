# The controller's rules, in evaluation order, and the parameters they use.
# trigger, condition and action are copied into the log and never evaluated.
# Each reason is a string.Template filled from the facts the rule's code passes.

[params]
tick_seconds = 10
confirm_seconds = 30                 # before isolation, or acting on a silent leased resource
rejoin_stable_seconds = 300          # a data path up this long before rejoin
unreachable_grace_seconds = 600      # a silent leased resource is fenced this long after its drain
resend_overlap = 3                   # intervals the cloud already had, resent on rejoin
fence_before_deadline_minutes = 5
release_before_deadline_minutes = 2
max_actions_per_hour = 10            # unforced actions per site

[[rule]]
id = "site-isolation"
version = 1
trigger = "cloud.unreachable"
condition = "no region reachable on any path for confirm_seconds"
action = "enter-isolated-mode"
rollback = "exit-isolated-mode"
reasons = { applied = "$reachable/$regions regions reachable for $seconds s on all paths" }

[[rule]]
id = "site-rejoin"
version = 1
trigger = "cloud.reachable"
condition = "isolated, and a data path up for rejoin_stable_seconds"
action = "exit-isolated-mode"
rollback = "enter-isolated-mode"
reasons = { applied = "data path stable for $seconds s; ship $records records, then $intervals intervals" }

[[rule]]
id = "desired-state"
version = 1
trigger = "desired-state.received"
condition = "not isolated, and a generation above the one applied for the handoff"
action = "apply-desired-state"
rollback = "none: the next generation supersedes it"
reasons = { applied = "gen $generation for $handoff above applied $applied; publish circuit.config.confirmed", ignored = "gen $generation for $handoff again: $generation <= applied $applied" }

[[rule]]
id = "drain-on-reclaim"
version = 1
trigger = "resource.reclaimed"
condition = "a reclaim notice for a leased resource, or one silent for confirm_seconds"
action = "cordon-and-drain"
rollback = "uncordon"
reasons = { applied = "cordon $resource and evict $evicted of its $pods pods, each service at or above its min; fence at $fence, release at $release" }

[[rule]]
id = "fence"
version = 1
trigger = "reclaim.fence-time"
condition = "a resource under reclaim at its fence time"
action = "fence"
rollback = "none: the owner's deadline forces it"
reasons = { applied = "$resource holds $pods pods of Share's, deleted; identity revoked; node deleted; disk key revoked; disks wiped" }

[[rule]]
id = "release"
version = 1
trigger = "reclaim.release-time"
condition = "a fenced resource at its release time"
action = "release-lease"
rollback = "none: the owner reclaimed it"
reasons = { applied = "release $resource: its owner reclaimed it", held = "release $resource: Share pays for it and its owner has not reclaimed it" }

[[rule]]
id = "wait"
version = 1
trigger = "blocked"
condition = "the site is isolated, or a service has pods pending with no allowed resource"
action = "wait"
rollback = "none"
reasons = { isolated = "site-bound services keep running on site resources; nothing moves, as a copy in the cloud could not reach the node", pending = "$service has $pending pods pending with no allowed resource" }

[[rule]]
id = "resume"
version = 1
trigger = "unblocked"
condition = "a blocked situation ends"
action = "resume"
rollback = "none"
reasons = { isolated = "the site rejoined the cloud", pending = "$service has no pod pending" }

[refusals]
site = "$resource is not on $site: a controller acts only on its own site"
cap = "$actions unforced actions in the last hour, the cap is $cap: frozen, a human decides"
