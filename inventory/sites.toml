# The estate: sites, the resources pods run on, network nodes and their handoffs.

[network]
paths = ["uplink-a", "uplink-b", "oob"]  # every pair of sites is joined by each of these paths
management_only = ["oob"]            # reach a site for operators; carry no desired state or records

[cluster]
namespace = "share"                  # where Share's pods run in each site's Kubernetes
trust_domain = "share.example"       # the SPIFFE trust domain every node's SPIRE agent joins

[telemetry]
counters = ["ifHCInOctets"]          # polled on every configured handoff
poll_minutes = 5

[[site]]
id = "barcelona"
code = "bcn"
role = "pop"

[[site]]
id = "marseille"
code = "mrs"
role = "pop"

[[site]]
id = "mombasa"
code = "mba"
role = "pop"

# A region's BGP neighbour on each path: its edge router, which every PoP's node peers with.
[[site]]
id = "E1"
code = "e1"
role = "region"
peers = { uplink-a = "192.0.2.101", uplink-b = "198.51.100.101", oob = "203.0.113.101" }

[[site]]
id = "E2"
code = "e2"
role = "region"
peers = { uplink-a = "192.0.2.102", uplink-b = "198.51.100.102", oob = "203.0.113.102" }

[[site]]
id = "E3"
code = "e3"
role = "region"
peers = { uplink-a = "192.0.2.103", uplink-b = "198.51.100.103", oob = "203.0.113.103" }

[[site]]
id = "cloudflare"
code = "cf"
role = "edge"

[[resource]]
id = "bcn-srv-1"
site = "barcelona"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "bcn-srv-2"
site = "barcelona"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "bcn-srv-3"
site = "barcelona"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mrs-srv-1"
site = "marseille"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mrs-srv-2"
site = "marseille"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mrs-srv-3"
site = "marseille"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mba-srv-1"
site = "mombasa"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mba-srv-2"
site = "mombasa"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mba-srv-3"
site = "mombasa"
kind = "share-server"
provider = "share"
trust = "trusted"

[[resource]]
id = "mba-kilima-01"
site = "mombasa"
kind = "partner-vm"
provider = "kilima-fibre"
trust = "attested"                   # a confidential VM whose attestation passed when it joined

[resource.lease]                     # leased: its owner can reclaim it, so it carries the reclaimable taint
notice_minutes = 10
paid_by = "share"

[resource.lease.fence]               # what the fence revokes
identity = "/spire/agent/k8s_psat/mombasa/mba-kilima-01"     # its SPIRE agent, banned
disk_key = "arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"   # its disks' key in Share's KMS, disabled

[[resource]]
id = "e1-cluster"
site = "E1"
kind = "region-cluster"
provider = "aws-paris"
trust = "trusted"

[[resource]]
id = "e2-cluster"
site = "E2"
kind = "region-cluster"
provider = "gcp-madrid"
trust = "trusted"

[[resource]]
id = "e3-cluster"
site = "E3"
kind = "region-cluster"
provider = "azure-frankfurt"
trust = "trusted"

# Each node's far-end peer on each path: the BFD neighbour at the other end of that path's link.
[[node]]
id = "bcn-node-1"
site = "barcelona"
peers = { uplink-a = "192.0.2.1", uplink-b = "198.51.100.1", oob = "203.0.113.1" }

[[node]]
id = "mrs-node-1"
site = "marseille"
peers = { uplink-a = "192.0.2.5", uplink-b = "198.51.100.5", oob = "203.0.113.5" }

[[node]]
id = "mba-node-1"
site = "mombasa"
peers = { uplink-a = "192.0.2.9", uplink-b = "198.51.100.9", oob = "203.0.113.9" }

[[handoff]]
id = "bcn-node-1/eth-1-12"
node = "bcn-node-1"
generation = 7

[[handoff]]
id = "mrs-node-1/eth-1-12"
node = "mrs-node-1"
generation = 7

[[handoff]]
id = "mba-node-1/eth-1-12"
node = "mba-node-1"
generation = 7

[[handoff]]
id = "bcn-node-1/eth-1-13"
node = "bcn-node-1"

[[handoff]]
id = "mba-node-1/eth-1-13"
node = "mba-node-1"
