# Services in placement order, from the design's Placement table.
# class: site-bound never leaves its PoP; anywhere runs in the regions.
# active and standby copies are per PoP for site-bound, per region for anywhere.
# min is the disruption budget a drain respects; min_trust: trusted > attested > untrusted.

[[service]]
id = "api"
class = "anywhere"
active = 2
standby = 0
min = 1
min_trust = "trusted"
tolerates_reclaimable = false

