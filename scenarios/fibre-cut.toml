# The brief's fibre cut: Mombasa loses every path to the cloud for six hours, and an agreement
# goes final while it is cut off.

name = "fibre-cut"
start = 2026-10-03T03:00:01Z
end = 2026-10-03T09:20:01Z
phases = [
    { at = 2026-10-03T03:02:01Z, title = "Atlas's agreement goes final" },
    { at = 2026-10-03T03:12:05Z, title = "the fibre cut isolates Mombasa" },
    { at = 2026-10-03T05:00:01Z, title = "an agreement goes final during the cut" },
    { at = 2026-10-03T09:12:05Z, title = "the link returns" },
]

[[event]]
at = 2026-10-03T03:02:01Z
kind = "agreement-final"
agreement = "atlas-0001"
version = 1
handoffs = ["bcn-node-1/eth-1-12", "mrs-node-1/eth-1-12", "mba-node-1/eth-1-12"]

[[event]]
at = 2026-10-03T03:12:05Z
kind = "paths-down"
site = "mombasa"
to = ["*"]
paths = ["primary", "oob"]

[[event]]
at = 2026-10-03T05:00:01Z
kind = "agreement-final"
agreement = "second-buyer-0001"
version = 1
handoffs = ["bcn-node-1/eth-1-13", "mba-node-1/eth-1-13"]

[[event]]
at = 2026-10-03T09:12:05Z
kind = "paths-up"
site = "mombasa"
to = ["*"]
paths = ["primary", "oob"]

[[event]]
at = 2026-10-03T09:17:21Z
kind = "resend-desired"
handoff = "mba-node-1/eth-1-13"
generation = 1

[[expect]]
at = 2026-10-03T03:02:11Z
controller = "site/barcelona"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "applied"
reason_contains = "gen 8 for bcn-node-1/eth-1-12 above applied 7"

[[expect]]
at = 2026-10-03T03:02:11Z
controller = "site/marseille"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "applied"
reason_contains = "gen 8 for mrs-node-1/eth-1-12 above applied 7"

[[expect]]
at = 2026-10-03T03:02:11Z
controller = "site/mombasa"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "applied"
reason_contains = "gen 8 for mba-node-1/eth-1-12 above applied 7"

[[expect]]
at = 2026-10-03T03:12:41Z
controller = "site/mombasa"
rule = "site-isolation@v1"
action = "enter-isolated-mode"
outcome = "applied"
reason_contains = "0/3 regions reachable for 30 s on all paths"

[[expect]]
at = 2026-10-03T03:12:41Z
controller = "site/mombasa"
rule = "wait@v1"
action = "wait"
outcome = "applied"
reason_contains = "nothing moves, as a copy in the cloud could not reach the node"

[[expect]]
at = 2026-10-03T05:00:11Z
controller = "site/barcelona"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "applied"
reason_contains = "gen 1 for bcn-node-1/eth-1-13 above applied 0"

[[expect]]
at = 2026-10-03T09:17:11Z
controller = "site/mombasa"
rule = "site-rejoin@v1"
action = "exit-isolated-mode"
outcome = "applied"
reason_contains = "data path stable for 300 s; ship 4 records, then 73 intervals"

[[expect]]
at = 2026-10-03T09:17:11Z
controller = "site/mombasa"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "applied"
reason_contains = "gen 1 for mba-node-1/eth-1-13 above applied 0"

[[expect]]
at = 2026-10-03T09:17:11Z
controller = "site/mombasa"
rule = "resume@v1"
action = "resume"
outcome = "applied"
reason_contains = "the site rejoined the cloud"

[[expect]]
at = 2026-10-03T09:17:31Z
controller = "site/mombasa"
rule = "desired-state@v1"
action = "apply-desired-state"
outcome = "ignored"
reason_contains = "gen 1 for mba-node-1/eth-1-13 again: 1 <= applied 1"

[[expect_coverage]]
handoff = "mba-node-1/eth-1-12"
counter = "ifHCInOctets"
held = 73
resent = 3
expected = 76
unique = 76
duplicates = 3
missing = 0

[expect_summary]
generations_applied = 5
replays_ignored = 1
decisions_merged = 10
